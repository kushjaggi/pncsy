name: Publish package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  test:
    name: Verify release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci || npm install --no-fund --no-audit
      - run: npm run check

      - name: Match tag to package version
        if: github.ref_type == 'tag'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          test "${GITHUB_REF_NAME}" = "v${VERSION}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match package.json v${VERSION}" >&2
            exit 1
          }

  publish-github-packages:
    name: GitHub Packages
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: "@kushjaggi"

      - name: Install deps
        run: npm ci --omit=dev || npm install --omit=dev

      - name: Publish to GitHub Packages
        run: |
          npm pkg set name=@kushjaggi/pncsy
          npm publish --registry=https://npm.pkg.github.com --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  bundle-release:
    name: Standalone bundle (no npm install)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm ci --omit=dev || npm install --omit=dev

      - name: Build tarballs
        id: bundle
        run: |
          VER=$(node -p "require('./package.json').version")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          tar --exclude=scripts/capture-screenshots.mjs \
            -czf "pncsy-${VER}.tar.gz" bin scripts skill examples \
            AGENTS.md README.md LICENSE package.json
          tar czf "pncsy-${VER}-deps.tar.gz" node_modules

      - name: Upload GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bundle.outputs.version }}
          name: v${{ steps.bundle.outputs.version }}
          files: |
            pncsy-${{ steps.bundle.outputs.version }}.tar.gz
            pncsy-${{ steps.bundle.outputs.version }}-deps.tar.gz
          generate_release_notes: true
          make_latest: true
