name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci || npm install --no-fund --no-audit
      - run: npm run check
      # Dogfood the repo gate: pncsy's own docs must keep their contract.
      - run: bash scripts/check-path.sh .
